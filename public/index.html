<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F4">
<title>給料日カウントダウン - 次の入金まであと何日？</title>
<meta name="description" content="給料日と月収を入れるだけで、次の入金まで残り日数と時間をリアルタイム表示。月末の給料日もちゃんと対応。">
<meta property="og:title" content="給料日カウントダウン">
<meta property="og:description" content="次の給料日まで、あと何日？">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F5F4;
  --surface: #FFFFFF;
  --surface-2: #EFEEEC;
  --surface-3: #E7E5E4;
  --border: #D6D3D1;
  --border-strong: #A8A29E;
  --text: #0A0A0A;
  --text-2: #262626;
  --dim: #57534E;
  --dim-2: #78716C;
  --primary: #0A0A0A;
  --success: #047857;
  --danger: #B91C1C;
  --warning: #B45309;
  --radius-sm: 4px;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow: 0 1px 2px rgba(10,10,10,0.04);
  --shadow-lg: 0 8px 24px -8px rgba(10,10,10,0.12);
  --duration: 160ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --font-sans: "Inter", "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", "Inter", ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --tap: 48px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"] {
  --bg: #0A0A0A;
  --surface: #141414;
  --surface-2: #1A1A1A;
  --surface-3: #222222;
  --border: #2A2A2A;
  --border-strong: #3F3F3F;
  --text: #FAFAFA;
  --text-2: #E5E5E5;
  --dim: #A3A3A3;
  --dim-2: #737373;
  --success: #34D399;
  --danger: #F87171;
  --warning: #FBBF24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv11","ss01","ss03";
  letter-spacing: -0.005em; overscroll-behavior-y: none;
}
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
  padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
button { font-family: inherit; font-size: inherit; cursor: pointer; background: none; border: none; color: inherit; }
input { font-family: inherit; font-size: inherit; color: inherit; }
.tnum { font-variant-numeric: tabular-nums; }

.app { flex: 1; display: flex; flex-direction: column; max-width: 540px; width: 100%;
  margin: 0 auto; padding: clamp(12px,4vw,20px) clamp(16px,5vw,28px) 48px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 clamp(24px,6vw,40px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; letter-spacing: -0.01em; color: var(--text); }
.brand-mark { width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--text); color: var(--bg);
  display: grid; place-items: center; font-size: 14px; font-weight: 700; font-family: var(--font-num); letter-spacing: -0.02em; }
.brand-meta { font-family: var(--font-mono); font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; margin-left: 2px; }
.icon-btn { width: var(--tap); height: var(--tap); display: grid; place-items: center; border-radius: var(--radius);
  color: var(--dim); transition: background var(--duration) var(--ease), color var(--duration) var(--ease); -webkit-tap-highlight-color: transparent; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:active { background: var(--surface-3); }
.icon-btn svg { width: 18px; height: 18px; }

.screen { flex: 1; display: flex; flex-direction: column; animation: fadeIn 240ms var(--ease); }
.screen[hidden] { display: none; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.hero { margin-bottom: clamp(28px,7vw,40px); }
.hero-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); margin-bottom: 14px; display: inline-flex; align-items: center; gap: 8px; }
.hero-eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--border-strong); }
.hero h1 { font-size: clamp(28px,7.5vw,36px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; margin-bottom: 12px; color: var(--text); }
.hero p { font-size: clamp(14px,3.8vw,15px); color: var(--dim); max-width: 40ch; line-height: 1.6; }

.field { margin-bottom: 22px; }
.field-label { display: flex; align-items: baseline; justify-content: space-between;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--dim);
  margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
.field-label .req { font-family: var(--font-sans); font-size: 10px; color: var(--dim-2); text-transform: none; letter-spacing: 0; font-weight: 400; }
.field-hint { font-family: var(--font-mono); font-size: 11px; color: var(--dim-2); margin-top: 10px; letter-spacing: 0; }

.preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.preset { min-height: 60px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); text-align: left;
  transition: border-color var(--duration) var(--ease), background var(--duration) var(--ease);
  display: flex; flex-direction: column; gap: 2px; -webkit-tap-highlight-color: transparent; }
.preset:hover { border-color: var(--border-strong); }
.preset:active { background: var(--surface-2); }
.preset[aria-pressed="true"] { border-color: var(--text); background: var(--surface); box-shadow: inset 0 0 0 1px var(--text); }
.preset-title { font-family: var(--font-mono); font-size: 10px; color: var(--dim); font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }
.preset-val { font-family: var(--font-num); font-size: 15px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.stepper { display: grid; grid-template-columns: var(--tap) 1fr var(--tap); align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  transition: border-color var(--duration) var(--ease); }
.stepper:focus-within { border-color: var(--text); }
.stepper button { height: var(--tap); color: var(--text); font-size: 20px; font-weight: 400;
  transition: background var(--duration) var(--ease); -webkit-tap-highlight-color: transparent; }
.stepper button:hover { background: var(--surface-2); }
.stepper input { height: var(--tap); border: none; text-align: center; background: transparent;
  font-size: 18px; font-weight: 600; font-family: var(--font-num); font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em; outline: none; width: 100%; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.input-wrap { position: relative; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); transition: border-color var(--duration) var(--ease); }
.input-wrap:focus-within { border-color: var(--text); }
.input-wrap input { width: 100%; height: var(--tap); padding: 0 14px 0 32px; border: none; background: transparent;
  outline: none; font-size: 16px; font-weight: 600; font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.input-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--dim); font-weight: 500; pointer-events: none; font-family: var(--font-num); }
.input-suffix { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--dim); font-family: var(--font-mono); font-size: 11px; pointer-events: none; }

.btn { width: 100%; min-height: 52px; padding: 0 20px; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: background var(--duration) var(--ease), border-color var(--duration) var(--ease), color var(--duration) var(--ease), transform 80ms var(--ease);
  user-select: none; -webkit-tap-highlight-color: transparent; position: relative; font-family: var(--font-sans); }
.btn:active { transform: scale(0.985); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-primary:hover { background: var(--text-2); }
[data-theme="dark"] .btn-primary { background: var(--text); color: var(--bg); }
[data-theme="dark"] .btn-primary:hover { background: var(--text-2); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn .btn-arrow { margin-left: auto; opacity: 0.6; transition: transform var(--duration) var(--ease), opacity var(--duration) var(--ease); }
.btn:hover .btn-arrow { opacity: 1; transform: translateX(2px); }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.countdown-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: clamp(40px,10vw,56px) clamp(20px,6vw,32px) clamp(32px,8vw,40px);
  text-align: center; margin-bottom: 16px; position: relative; overflow: hidden; }
.countdown-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: var(--text); opacity: 0.3; }
.countdown-card.payday::before { background: var(--success); opacity: 0.6; }
.countdown-label { font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.14em; color: var(--dim); margin-bottom: 18px; }
.countdown-card.payday .countdown-label { color: var(--success); }
.days-big { font-family: var(--font-num); font-size: clamp(56px,18vw,96px); font-weight: 700;
  letter-spacing: -0.06em; line-height: 0.9; font-variant-numeric: tabular-nums; color: var(--text); }
.days-unit { font-family: var(--font-mono); font-size: 12px; color: var(--dim); letter-spacing: 0.08em;
  text-transform: uppercase; margin-top: 6px; }
.countdown-hms { font-family: var(--font-num); font-size: clamp(18px,5vw,22px); font-weight: 500;
  letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--dim); margin-top: 14px; }

.amount-strip { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.amount-label { font-family: var(--font-mono); font-size: 11px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
.amount-val { font-family: var(--font-num); font-size: clamp(22px,6vw,28px); font-weight: 700;
  letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--text); }
.amount-val .yen { font-size: 0.6em; font-weight: 400; color: var(--dim); margin-right: 0.12em; vertical-align: 0.18em; letter-spacing: 0; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.stat-label { font-family: var(--font-mono); font-size: 10px; color: var(--dim); margin-bottom: 6px;
  font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }
.stat-val { font-family: var(--font-num); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

.footer { margin-top: auto; padding-top: 40px; font-family: var(--font-mono); font-size: 10px; color: var(--dim-2);
  text-align: center; text-transform: uppercase; letter-spacing: 0.1em; }
.footer a { color: var(--dim); text-decoration: none; transition: color var(--duration) var(--ease); }
.footer a:hover { color: var(--text); }

.toast { position: fixed; bottom: calc(20px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--bg);
  padding: 12px 18px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
  box-shadow: var(--shadow-lg); opacity: 0;
  transition: opacity 220ms var(--ease), transform 220ms var(--ease); z-index: 100; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 768px) { .app { max-width: 100%; } }
@media (max-width: 480px) {
  :root { --tap: 52px; }
  body { font-size: 14px; }
  .app { padding: 12px 16px 40px; }
  .topbar { padding: 2px 0 22px; }
  .brand { font-size: 12px; gap: 8px; }
  .brand-mark { width: 26px; height: 26px; font-size: 13px; }
  .hero { margin-bottom: 26px; }
  .hero h1 { font-size: clamp(26px,8.5vw,32px); letter-spacing: -0.03em; }
  .field { margin-bottom: 20px; }
  .preset { min-height: 64px; padding: 12px 14px; }
  .preset-val { font-size: 16px; }
  .countdown-card { padding: 36px 18px 30px; border-radius: 8px; }
  .days-big { font-size: clamp(52px,19vw,76px); }
  .amount-val { font-size: clamp(22px,6vw,26px); }
  .stats-grid { gap: 6px; }
  .stat { padding: 12px 14px; }
  .stat-val { font-size: 15px; }
  .btn-row { gap: 6px; }
  .btn { min-height: 54px; font-size: 14.5px; padding: 0 16px; }
  .footer { padding-top: 32px; font-size: 9px; }
}
@media (max-width: 360px) {
  .hero h1 { font-size: 24px; }
  .days-big { font-size: 52px; }
  .amount-val { font-size: 20px; }
  .btn { font-size: 14px; }
}
@media (max-height: 560px) and (orientation: landscape) {
  .hero { margin-bottom: 20px; }
  .hero h1 { font-size: 22px; }
  .countdown-card { padding: 24px 20px; }
  .days-big { font-size: 48px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after {
  animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
@media (hover: none) {
  .btn-primary:hover { background: var(--text); }
  .btn-secondary:hover { background: var(--surface); border-color: var(--border); }
  .preset:hover { border-color: var(--border); }
  .icon-btn:hover { background: transparent; color: var(--dim); }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">¥</div>
      <span>Payday</span>
      <span class="brand-meta">v1.0</span>
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="テーマ切替">
      <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <section class="screen" id="setupScreen">
    <div class="hero">
      <div class="hero-eyebrow">Real-time · Client-side</div>
      <h1>給料日まで、<br>あと何日？</h1>
      <p>給料日と月収を入れるだけで、次の入金までの残り日数・時間と入金予定額を表示します。</p>
    </div>

    <div class="field">
      <label class="field-label">
        <span>給料日</span>
        <span class="req">必須</span>
      </label>
      <div class="preset-grid">
        <button type="button" class="preset" data-day="15">
          <span class="preset-title">毎月15日</span>
          <span class="preset-val">15日</span>
        </button>
        <button type="button" class="preset" data-day="20">
          <span class="preset-title">毎月20日</span>
          <span class="preset-val">20日</span>
        </button>
        <button type="button" class="preset" data-day="25" aria-pressed="true">
          <span class="preset-title">毎月25日</span>
          <span class="preset-val">25日</span>
        </button>
        <button type="button" class="preset" data-day="31">
          <span class="preset-title">月末</span>
          <span class="preset-val">末日</span>
        </button>
      </div>
      <div class="stepper">
        <button type="button" id="dayMinus" aria-label="減らす">−</button>
        <input type="number" id="dayInput" value="25" min="1" max="31" inputmode="numeric" aria-label="給料日（日）">
        <button type="button" id="dayPlus" aria-label="増やす">＋</button>
      </div>
      <p class="field-hint">31を選ぶと月末扱い（28〜31日の月に自動対応）</p>
    </div>

    <div class="field">
      <label class="field-label">
        <span>月収（手取り or 額面）</span>
        <span class="req">必須</span>
      </label>
      <div class="preset-grid">
        <button type="button" class="preset salary-preset" data-salary="200000">
          <span class="preset-title">新卒</span>
          <span class="preset-val">¥20万</span>
        </button>
        <button type="button" class="preset salary-preset" data-salary="300000" aria-pressed="true">
          <span class="preset-title">中堅</span>
          <span class="preset-val">¥30万</span>
        </button>
        <button type="button" class="preset salary-preset" data-salary="500000">
          <span class="preset-title">管理職</span>
          <span class="preset-val">¥50万</span>
        </button>
        <button type="button" class="preset salary-preset" data-salary="1000000">
          <span class="preset-title">役員</span>
          <span class="preset-val">¥100万</span>
        </button>
      </div>
      <div class="input-wrap">
        <span class="input-prefix">¥</span>
        <input type="number" id="salaryInput" value="300000" min="0" max="999999999" inputmode="numeric" aria-label="カスタム月収">
        <span class="input-suffix">/ 月</span>
      </div>
    </div>

    <button class="btn btn-primary" id="startBtn">
      カウントダウン開始
      <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </section>

  <section class="screen" id="countdownScreen" hidden>
    <div class="countdown-card" id="countdownCard">
      <div class="countdown-label" id="countdownLabel">次の給料日まで</div>
      <div class="days-big tnum" id="daysDisplay">0</div>
      <div class="days-unit" id="daysUnit">DAYS</div>
      <div class="countdown-hms tnum" id="hmsDisplay">00:00:00</div>

      <div class="amount-strip">
        <div class="amount-label">次回入金予定額</div>
        <div class="amount-val tnum"><span class="yen">¥</span><span id="amountDisplay">0</span></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat">
        <div class="stat-label">Next Payday</div>
        <div class="stat-val tnum" id="statPayday">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">Per Day (avg)</div>
        <div class="stat-val tnum"><span style="font-size:12px;color:var(--dim);margin-right:2px;font-family:var(--font-mono);font-weight:400;">¥</span><span id="statDaily">0</span></div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="changeBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        設定を変更
      </button>
      <button class="btn btn-secondary" id="shareBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Xでシェア
      </button>
    </div>
  </section>

  <footer class="footer">
    <a href="https://x.com/otsu_dev" target="_blank" rel="noopener">100 Web Apps Challenge · #16</a>
  </footer>
</div>

<div class="toast" id="toast">コピーしました</div>

<script>
(() => {
  'use strict';

  const state = { day: 25, salary: 300000, tickId: 0 };

  const $ = (id) => document.getElementById(id);
  const setup = $('setupScreen');
  const countdown = $('countdownScreen');
  const dayInput = $('dayInput');
  const salaryInput = $('salaryInput');
  const dayPresets = document.querySelectorAll('.preset[data-day]');
  const salaryPresets = document.querySelectorAll('.salary-preset');
  const card = $('countdownCard');
  const label = $('countdownLabel');
  const daysDisplay = $('daysDisplay');
  const daysUnit = $('daysUnit');
  const hmsDisplay = $('hmsDisplay');
  const amountDisplay = $('amountDisplay');
  const statPayday = $('statPayday');
  const statDaily = $('statDaily');
  const toast = $('toast');

  const fmt = (n) => Math.floor(n).toLocaleString('ja-JP');
  const pad2 = (n) => String(n).padStart(2, '0');

  // ===== Theme =====
  const themeToggle = $('themeToggle');
  const iconSun = $('iconSun');
  const iconMoon = $('iconMoon');
  const applyTheme = (t) => {
    document.documentElement.setAttribute('data-theme', t);
    iconSun.hidden = t === 'dark';
    iconMoon.hidden = t !== 'dark';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0A0A0A' : '#F5F5F4');
  };
  const savedTheme = localStorage.getItem('pc-theme') ||
    (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(savedTheme);
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('pc-theme', next);
    applyTheme(next);
  });

  // ===== Setup controls =====
  dayPresets.forEach(btn => {
    btn.addEventListener('click', () => {
      dayPresets.forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      dayInput.value = btn.dataset.day;
    });
  });
  $('dayMinus').addEventListener('click', () => {
    dayInput.value = Math.max(1, Number(dayInput.value) - 1);
    dayPresets.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day) === String(dayInput.value) ? 'true' : 'false'));
  });
  $('dayPlus').addEventListener('click', () => {
    dayInput.value = Math.min(31, Number(dayInput.value) + 1);
    dayPresets.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day) === String(dayInput.value) ? 'true' : 'false'));
  });
  dayInput.addEventListener('input', () => {
    const v = Math.max(1, Math.min(31, Number(dayInput.value) || 1));
    dayInput.value = v;
    dayPresets.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day) === String(v) ? 'true' : 'false'));
  });

  salaryPresets.forEach(btn => {
    btn.addEventListener('click', () => {
      salaryPresets.forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      salaryInput.value = btn.dataset.salary;
    });
  });
  salaryInput.addEventListener('input', () => {
    salaryPresets.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.salary) === String(salaryInput.value) ? 'true' : 'false'));
  });

  // ===== Restore =====
  const saved = (() => { try { return JSON.parse(localStorage.getItem('pc-settings') || '{}'); } catch { return {}; } })();
  if (saved.day) {
    dayInput.value = saved.day;
    dayPresets.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day) === String(saved.day) ? 'true' : 'false'));
  }
  if (saved.salary) {
    salaryInput.value = saved.salary;
    salaryPresets.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.salary) === String(saved.salary) ? 'true' : 'false'));
  }

  // ===== Next payday calculation =====
  function lastDayOfMonth(year, monthIdx) {
    return new Date(year, monthIdx + 1, 0).getDate();
  }
  function computeNextPayday(day) {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const thisMonthEnd = lastDayOfMonth(y, m);
    const thisMonthPayday = Math.min(day, thisMonthEnd);
    const paydayThisMonth = new Date(y, m, thisMonthPayday, 0, 0, 0, 0);
    if (paydayThisMonth > now) return paydayThisMonth;
    const ny = m === 11 ? y + 1 : y;
    const nm = (m + 1) % 12;
    const nextEnd = lastDayOfMonth(ny, nm);
    const nextPayday = Math.min(day, nextEnd);
    return new Date(ny, nm, nextPayday, 0, 0, 0, 0);
  }
  function isPaydayToday(day) {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth();
    const monthEnd = lastDayOfMonth(y, m);
    const target = Math.min(day, monthEnd);
    return now.getDate() === target;
  }

  // ===== Start =====
  $('startBtn').addEventListener('click', () => {
    state.day = Math.max(1, Math.min(31, Number(dayInput.value) || 25));
    state.salary = Math.max(0, Number(salaryInput.value) || 0);
    try { localStorage.setItem('pc-settings', JSON.stringify({ day: state.day, salary: state.salary })); } catch {}
    const next = computeNextPayday(state.day);
    statPayday.textContent = `${next.getMonth()+1}/${next.getDate()}`;
    statDaily.textContent = fmt(state.salary / 30);
    setup.hidden = true;
    countdown.hidden = false;
    window.scrollTo({ top: 0, behavior: 'instant' });
    tick();
    state.tickId = setInterval(tick, 1000);
  });

  // ===== Tick =====
  function tick() {
    const now = new Date();
    const next = computeNextPayday(state.day);
    const diffMs = next - now;

    if (isPaydayToday(state.day)) {
      card.classList.add('payday');
      label.textContent = '本日、給料日です';
      daysDisplay.textContent = '0';
      daysUnit.textContent = 'PAYDAY';
      hmsDisplay.textContent = '';
      amountDisplay.textContent = fmt(state.salary);
      statPayday.textContent = '今日';
      return;
    }

    card.classList.remove('payday');
    label.textContent = '次の給料日まで';
    const totalSec = Math.floor(diffMs / 1000);
    const days = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    daysDisplay.textContent = days;
    daysUnit.textContent = 'DAYS';
    hmsDisplay.textContent = `${pad2(hours)}:${pad2(mins)}:${pad2(secs)}`;
    amountDisplay.textContent = fmt(state.salary);
  }

  // ===== Change =====
  $('changeBtn').addEventListener('click', () => {
    clearInterval(state.tickId);
    countdown.hidden = true;
    setup.hidden = false;
    window.scrollTo({ top: 0, behavior: 'instant' });
  });

  // ===== Share =====
  $('shareBtn').addEventListener('click', () => {
    const now = new Date();
    const next = computeNextPayday(state.day);
    const days = Math.floor((next - now) / 86400000);
    let text;
    if (isPaydayToday(state.day)) {
      text = `今日は給料日です。¥${fmt(state.salary)}の入金が待ってます。\n\n#給料日カウントダウン`;
    } else {
      text = `次の給料日まであと${days}日。¥${fmt(state.salary)}の入金を待ちます。\n\n#給料日カウントダウン`;
    }
    const url = location.origin;
    window.open(`https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank', 'noopener');
  });

  // ===== Keyboard =====
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !setup.hidden) $('startBtn').click();
    if (e.key === 'Escape' && !countdown.hidden) $('changeBtn').click();
  });
})();
</script>
</body>
</html>
